name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
      - name: Run unit tests, compile instrumentation tests, and build debug APK
        working-directory: IPCameraViewer
        run: ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ip-camera-viewer-debug-apk
          path: IPCameraViewer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

